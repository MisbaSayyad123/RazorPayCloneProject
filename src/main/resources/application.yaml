spring:
  application:
    name: razorpay

  datasource:
    url: jdbc:postgresql://localhost:5432/razorpayDB
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

debug: false

payment:
  order:
    default-order-expiry-minutes: 30